name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Cancel superseded runs of the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '24'

jobs:
  quality:
    name: Quality (style, static analysis, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No database here: static checks only need dependencies and the asset
      # build, which also generates the Wayfinder route types used by tsc.
      - name: Setup application
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build

      - name: PHP code style (Pint)
        run: composer lint:check

      - name: PHP static analysis (Larastan)
        run: composer types:check

      - name: Frontend lint and format (Vite+)
        run: npm run check

      - name: TypeScript
        run: npm run types:check

      - name: Frontend unit tests (Vitest)
        run: npm test
        env:
          # Vitest loads Vite in serve mode, which laravel-vite-plugin refuses
          # in CI to stop HMR servers. These tests never start one.
          LARAVEL_BYPASS_ENV_CHECK: '1'

      - name: Dependency audit
        run: |
          composer audit
          npm audit --omit=dev --audit-level=high

  tests:
    name: Tests (Pest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write # publish the JUnit report as a check run

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskflow_test
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Real environment variables take precedence over .env, so the setup
    # migrations and the test suite both target the service database.
    env:
      DB_DATABASE: taskflow_test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: pcov

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup application
        run: composer setup

      # Browser tests (tests/Browser) drive a real Chromium through Playwright.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run test suite with coverage
        shell: bash
        run: |
          mkdir -p build/reports
          php artisan config:clear
          vendor/bin/pest \
            --colors=never \
            --coverage \
            --log-junit build/reports/junit.xml \
            --coverage-clover build/reports/clover.xml \
            | tee build/reports/pest-output.txt

      - name: Write coverage to job summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo '### Test coverage'
            echo '```'
            cat build/reports/pest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: build/reports/junit.xml
          check_name: Pest test report
          detailed_summary: true
          include_passed: true

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports
          retention-days: 14

  e2e:
    name: Realtime E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskflow_test
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_DATABASE: taskflow_test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup application
        run: composer setup

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Two browsers against a local Reverb server: see playwright.config.ts.
      - name: Run two-user journey
        run: npm run e2e

      - name: Upload failure traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: test-results
          retention-days: 7

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint commit messages
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
